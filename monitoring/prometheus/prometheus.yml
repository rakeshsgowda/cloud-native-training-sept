global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'customer-service'
    metrics_path: '/actuator/prometheus'
    scrape_protocols: ["PrometheusText0.0.4"]
    static_configs:
      - targets: ['customer-service:8081']

