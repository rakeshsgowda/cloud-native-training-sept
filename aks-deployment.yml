# =============================================================
# RETAIL BANKING - AKS DEPLOYMENT (SHARED APP, per-user logins)
# =============================================================
# This is the LIVE config running at http://4.186.154.199:5173/
#
# ONE shared app stack. 26 staff logins (user1..user26) are seeded into the
# DB by the "seed-users" Job at the end of this file.
#   Login:  user1 ... user26   Password: Bank@123   Role: STAFF
#
# DEPLOY:
#   kubectl create namespace retail-banking
#   kubectl apply -n retail-banking -f retail-banking-aks.txt
#   kubectl get svc frontend -n retail-banking      # -> open http://<EXTERNAL-IP>:5173/
#
# Fixes baked in:
#   - kafka: enableServiceLinks:false + 1@localhost:9093 (KRaft boot)
#   - grafana + prometheus: permission init-containers
#   - storage: emptyDir (no PVCs -> no node disk-limit issues)
#   - frontend LOGIN FIX: initContainer rewrites hardcoded localhost:8081/8082
#     -> same-origin /svc-cust, /svc-acct ; nginx proxies to the cluster svcs.
#     (Fixes the "Network Error" on Sign in. No image rebuild.)
# =============================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
type: Opaque
stringData:
  DB_USERNAME: banking
  DB_PASSWORD: banking
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
type: Opaque
stringData:
  JWT_SECRET: "retail-banking-training-jwt-secret-change-in-production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
data:
  01-init.sql: |
    CREATE DATABASE account_db;
    \connect customer_db
    GRANT ALL PRIVILEGES ON DATABASE customer_db TO banking;
    GRANT ALL PRIVILEGES ON SCHEMA public TO banking;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO banking;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO banking;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO banking;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO banking;
    \connect account_db
    GRANT ALL PRIVILEGES ON DATABASE account_db TO banking;
    GRANT ALL PRIVILEGES ON SCHEMA public TO banking;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO banking;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO banking;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO banking;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO banking;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - {name: POSTGRES_DB, value: customer_db}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: app-secret, key: DB_USERNAME}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secret, key: DB_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: postgres-data, mountPath: /var/lib/postgresql/data}
            - {name: postgres-init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U banking -d customer_db"]}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec: {command: [sh, -c, "pg_isready -U banking -d customer_db"]}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - {name: postgres-data, emptyDir: {}}
        - {name: postgres-init, configMap: {name: postgres-init-scripts}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false          # <-- REQUIRED: stops k8s injecting KAFKA_PORT
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - {containerPort: 9092}
            - {containerPort: 9093}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}  # localhost avoids boot deadlock
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_LOG_DIRS, value: "/tmp/kraft-combined-logs"}
            - {name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk"}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1Gi}
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - {name: internal, port: 9092, targetPort: 9092}
    - {name: controller, port: 9093, targetPort: 9093}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: solo01akslab.azurecr.io/customer-service:t01-v3
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8081}
          env:
            - {name: DB_URL, value: "jdbc:postgresql://postgres:5432/customer_db"}
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: app-secret, key: DB_USERNAME}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secret, key: DB_PASSWORD}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8081}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8081}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  type: ClusterIP
  selector:
    app: customer-service
  ports:
    - {port: 8081, targetPort: 8081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: solo01akslab.azurecr.io/account-service:t01-v3
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 8082}
          env:
            - {name: DB_URL, value: "jdbc:postgresql://postgres:5432/account_db"}
            - name: DB_USERNAME
              valueFrom: {secretKeyRef: {name: app-secret, key: DB_USERNAME}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secret, key: DB_PASSWORD}}
            - {name: CUSTOMER_SERVICE_URL, value: "http://customer-service:8081"}
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "kafka:9092"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8082}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8082}
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
spec:
  type: ClusterIP
  selector:
    app: account-service
  ports:
    - {port: 8082, targetPort: 8082}
---
# nginx config for the frontend pod: serve the SPA + proxy same-origin API
# prefixes to the in-cluster backend services (the login-fix).
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
        # customer-service (was http://localhost:8081)
        location /svc-cust/ {
            proxy_pass http://customer-service:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # account-service (was http://localhost:8082)
        location /svc-acct/ {
            proxy_pass http://account-service:8082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      volumes:
        - name: site
          emptyDir: {}
        - name: nginx-conf
          configMap: {name: frontend-nginx}
      initContainers:
        # copy the static site into a shared volume and rewrite the two
        # hardcoded localhost backend URLs to same-origin prefixes.
        - name: patch-site
          image: solo01akslab.azurecr.io/frontend:t01-v1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              cp -r /usr/share/nginx/html/. /site/
              for f in /site/assets/*.js; do
                sed -i 's#http://localhost:8081#/svc-cust#g; s#http://localhost:8082#/svc-acct#g' "$f"
              done
              echo "patched: $(grep -roE '/svc-(cust|acct)' /site/assets/*.js | sort | uniq -c)"
          volumeMounts:
            - {name: site, mountPath: /site}
      containers:
        - name: frontend
          image: solo01akslab.azurecr.io/frontend:t01-v1
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 80}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: site, mountPath: /usr/share/nginx/html}
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - {port: 5173, targetPort: 80}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'customer-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['customer-service:8081']
      - job_name: 'account-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['account-service:8082']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      initContainers:
        - name: fix-prometheus-permissions
          image: busybox:1.36
          command: [sh, -c, "chown -R 65534:65534 /prometheus && chmod -R u+rwX /prometheus"]
          securityContext: {runAsUser: 0}
          volumeMounts:
            - {name: prometheus-data, mountPath: /prometheus}
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - {containerPort: 9090}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 300m, memory: 512Mi}
          volumeMounts:
            - {name: prometheus-config, mountPath: /etc/prometheus, readOnly: true}
            - {name: prometheus-data, mountPath: /prometheus}
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9090}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - {name: prometheus-config, configMap: {name: prometheus-config}}
        - {name: prometheus-data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - {port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      initContainers:
        - name: fix-grafana-permissions
          image: busybox:1.36
          command: [sh, -c, "chown -R 472:472 /var/lib/grafana && chmod -R u+rwX /var/lib/grafana"]
          securityContext: {runAsUser: 0}
          volumeMounts:
            - {name: grafana-data, mountPath: /var/lib/grafana}
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {containerPort: 3000}
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: grafana-data, mountPath: /var/lib/grafana}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - {name: grafana-data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - {port: 3000, targetPort: 3000}
---
# Seeds 26 STAFF logins (user1..user26 / Bank@123) into customer_db.app_user
# once postgres + customer-service are up. Re-runnable (ON CONFLICT upsert).
# The bcrypt hash below == "Bank@123".
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-users
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: postgres:16
          env:
            - {name: PGPASSWORD, value: banking}
          command:
            - sh
            - -c
            - |
              set -e
              echo "waiting for postgres + app_user table..."
              until psql -h postgres -U banking -d customer_db -c "SELECT 1 FROM app_user LIMIT 1;" >/dev/null 2>&1; do
                sleep 5
              done
              HASH='$2a$10$FQIOXlU1Ael.wP6Qdp4UKue0B1K.rmnJ2uPijuxxtvXhPWpMyweBu'   # = Bank@123
              for i in $(seq 1 26); do
                psql -h postgres -U banking -d customer_db -c \
                  "INSERT INTO app_user (username, password_hash, role) VALUES ('user'$i, '$HASH', 'STAFF') ON CONFLICT (username) DO UPDATE SET password_hash=EXCLUDED.password_hash;"
              done
              echo "seeded user1..user26 / Bank@123"
